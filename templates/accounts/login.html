{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-3 py-8 sm:py-12">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-extrabold text-gray-900">Welcome Back</h1>
            <p class="text-xs sm:text-sm text-gray-500">Log in to manage your Dormaa Mall ads</p>
        </div>

        <!-- Error Alert -->
        {% if form.errors %}
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-xs">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <div class="space-y-1">
                <label for="{{ form.username.id_for_label }}" class="block text-xs font-bold text-gray-700">Username</label>
                {{ form.username }}
            </div>

            <div class="space-y-1">
                <label for="{{ form.password.id_for_label }}" class="block text-xs font-bold text-gray-700">Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition text-sm mt-2">
                Log In
            </button>
        </form>

        <!-- Register Link -->
        <div class="text-center pt-2 border-t border-gray-100">
            <p class="text-xs text-gray-600">
                Don't have an account? 
                <a href="{% url 'accounts:register' %}" class="text-green-700 hover:text-green-800 font-bold">Create one free</a>
            </p>
        </div>

    </div>
</div>

<style>
    form input {
        width: 100%;
        padding: 0.65rem 0.85rem;
        font-size: 0.875rem;
        border: 1px solid #e5e7eb;
        border-radius: 0.75rem;
        background-color: #f9fafb;
        outline: none;
        transition: all 0.2s;
    }
    form input:focus {
        background-color: #ffffff;
        border-color: #15803d;
        box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.1);
    }
</style>
{% endblock %}
