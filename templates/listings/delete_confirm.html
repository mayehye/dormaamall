{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-3 py-12">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8 space-y-5 text-center">
        <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
            ⚠️
        </div>

        <div class="space-y-1">
            <h1 class="text-xl font-extrabold text-gray-900">Delete Ad?</h1>
            <p class="text-xs sm:text-sm text-gray-500">Are you sure you want to delete <span class="font-bold text-gray-800">"{{ ad.title }}"</span>? This action cannot be undone.</p>
        </div>

        <form method="POST" class="flex gap-3 pt-2">
            {% csrf_token %}
            <a href="{% url 'listings:dashboard' %}" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-2.5 px-4 rounded-xl text-xs sm:text-sm transition">
                Cancel
            </a>
            <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs sm:text-sm transition shadow-sm">
                Yes, Delete
            </button>
        </form>
    </div>
</div>
{% endblock %}
